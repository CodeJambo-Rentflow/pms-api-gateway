server:
  port: 8081

spring:
  application:
    name: pms-api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/pms-kenya
          jwk-set-uri: http://localhost:8088/realms/pms-kenya/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        # Health check route example — replace with real service routes later
        - id: example-placeholder
          uri: http://localhost:9999
          predicates:
            - Path=/api/v1/_placeholder/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    ke.co.codejambo.rentflow: DEBUG
